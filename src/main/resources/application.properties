spring.application.name=enterprise-order-management-system

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/enterprise_oms}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET:my-super-secret-key-for-enterprise-oms-project-2026}
jwt.expiration=${JWT_EXPIRATION:3600000}